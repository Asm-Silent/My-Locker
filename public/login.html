<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Locker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
        <a href="/" class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">🎒 My Locker</a>
        <a href="/register.html" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold transition">Get Started</a>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-md mx-auto px-6 py-12 w-full">
        <div class="bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-bold mb-2 text-center">Welcome Back</h2>
            <p class="text-slate-400 text-sm text-center mb-6">Access your locker and files.</p>

            <!-- Error/Success Alert Box -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="student@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 mt-2">Login to Locker</button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-400">
                Don't have an account? <a href="/register.html" class="text-indigo-400 hover:underline">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800/80 border-t border-slate-700/60 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 My Locker Platform.</p>
    </footer>

    <!-- Frontend Script to Handle Login API Call -->
    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-emerald-500/20 border border-emerald-500/30 text-emerald-300";
                    alertBox.textContent = `Login successful! Welcome back, ${data.name}. Redirecting...`;
                    alertBox.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/dashboard.html', 1500);
                } else {
                    alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-rose-500/20 border border-rose-500/30 text-rose-300";
                    alertBox.textContent = data.error || "Login failed.";
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-rose-500/20 border border-rose-500/30 text-rose-300";
                alertBox.textContent = "Network error. Please try again.";
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
